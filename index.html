<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#EDEDF4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1D2024" media="(prefers-color-scheme: dark)">
  <title>Flight Deck · TUM Aerospace</title>
  <meta name="description" content="Unofficial, student-made schedule for TUM Aerospace 1st semester: TUMonline sync, live commute, Mensa and Moodle. Not affiliated with or endorsed by the Technical University of Munich.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>
    // Your colour seed, before first paint (app.js changes it from Settings)
    try { var seed = localStorage.getItem('fd_md_seed'); if (seed) document.documentElement.style.setProperty('--seed', seed); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <nav class="sidebar" aria-label="Main">
      <div class="brand">Flight Deck</div>
      <button type="button" class="fab" data-new-appt><span class="msr" aria-hidden="true">add</span>New appointment</button>
      <div class="side-group">
        <button type="button" class="side-item" data-view="today"><span class="msr" aria-hidden="true">today</span>Today<kbd>1</kbd></button>
        <button type="button" class="side-item" data-view="week"><span class="msr" aria-hidden="true">calendar_view_week</span>Week<kbd>2</kbd></button>
        <button type="button" class="side-item" data-view="groups"><span class="msr" aria-hidden="true">groups</span>Groups<kbd>3</kbd></button>
        <button type="button" class="side-item" data-view="squad"><span class="msr" aria-hidden="true">diversity_3</span>Squad<kbd>4</kbd></button>
      </div>
      <div class="side-group">
        <span class="side-label">Courses</span>
        <div id="courseList"></div>
      </div>
      <div class="side-foot">
        <div id="weekProgress"></div>
        <button type="button" class="side-item" data-open-settings><span class="msr" aria-hidden="true">settings</span>Settings<kbd>,</kbd></button>
      </div>
    </nav>

    <main class="main" id="main">
      <header class="toolbar">
        <div class="title-block">
          <span class="eyebrow" id="eyebrow"></span>
          <h1 id="title"></h1>
          <span class="subtitle" id="subtitle"></span>
        </div>
        <div class="toolbar-actions" id="toolbarActions"></div>
      </header>
      <div id="view" class="view"></div>
    </main>

    <aside class="inspector" id="inspector" aria-label="Moodle"></aside>
  </div>

  <nav class="tabbar" aria-label="Views">
    <button type="button" data-view="today"><span class="pill"><span class="msr" aria-hidden="true">today</span></span>Today</button>
    <button type="button" data-view="week"><span class="pill"><span class="msr" aria-hidden="true">calendar_view_week</span></span>Week</button>
    <button type="button" data-view="groups"><span class="pill"><span class="msr" aria-hidden="true">groups</span></span>Groups</button>
    <button type="button" data-view="squad"><span class="pill"><span class="msr" aria-hidden="true">diversity_3</span></span>Squad</button>
    <button type="button" data-open-settings><span class="pill"><span class="msr" aria-hidden="true">settings</span></span>Settings</button>
  </nav>

  <button type="button" class="fab fab-mobile" data-new-appt aria-label="New appointment"><span class="msr" aria-hidden="true">add</span></button>

  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button type="button" class="sheet-done" data-close-sheet>Done</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/timetable.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/services.js"></script>
  <script src="js/autopilot.js"></script>
  <script src="js/squad.js"></script>
  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
